<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="res/css/addPost.css">
    <title>Add Post</title>
</head>

<body>
    <header class="nav-header">
        <ul class="nav">
            <li><a href="index.html">Home</a></li>
        </ul>
        <a class="avatar"><img src="res/images/default-avatar.png" alt="Avatar"></a>
    </header>

    <main>
        <form action="index.html"><!---submitting the form directs to index.html-->
            <div class="form-element">
                <label for="textarea">Post body</label>
                <textarea id="textarea" placeholder="textarea"></textarea>
            </div>

            <div class="form-element">
                <label for="fileupload">Select file</label>
                <input type="file" id="fileupload">
            </div>

            <div class="form-element">
                <button type="submit">Create post</button>
            </div>
        </form>
    </main>
    
</body>
</html>
