<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="res/css/login.css">
    <link rel="icon" href="res/images/favicon.ico" type="image/x-icon">
    <title>Login</title>
</head>

<body>

    <header class="nav-header">
        <ul class="nav">
            <li><a href="index.html">Home</a></li>
        </ul>

        <a class="avatar">
            <img src="res/images/default-avatar.png" alt="Avatar">
        </a>
    </header>

    <main class="main-container">
        <section class="login-box">
            <h2>Welcome to PostIt</h2>
            <a href="#" class="create-acc">Create an account</a>
            <p class="or-text">or</p>
            <p class="login-title">Please log in</p>

            <form action="index.html" method="GET" class="login-form">
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit" class="login-btn">Log in</button>
            </form>
            
            <a href="#" class="forgot-pass">Forgot password?</a>
        </section>
    </main>
</body>

</html>
