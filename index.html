<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- The below line is for the mobile view responsiveness
     It setss the the page width to the device's width.
     Initial-scale just sets what the zoom level be at the start-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Feed</title>
    <!--Telling the page what stylesheet to refrence-->
    <link rel="stylesheet" href="res/css/index.css">
    <link rel="icon" href="res/images/favicon.ico" type="image/x-icon">
    <!--Telling the page where will our dynamic javascript be
    defer matters here as the script needs .feed to already exist in the DOM. defer download
    the file in parallel with HTML parsing but waits until the document is fully parsed before running.-->
    <script src="res/javascripts/index.js" defer></script>
</head>
<body>

    <!--Header and navigation-->
    <header>
        <nav class="nav-bar">
            <div class="nav-links">
                <!--Points to our home page which is index.html-->
                <a href="index.html" class="active">Home</a>
                <!--Just makes a vertical line to seperate the Home and add post
                button.-->
                <span class="divider">|</span>
                <!--Button when pressed sends the user to addPost.html-->
                <a href="addPost.html">Make a Post</a>
            </div>
            <div class="user-profile">
                <!--User avatar icon and a link to login-->
                <a href="login.html" title="User Profile">
                    <!-- This is for the top right user icon.
                    Wrapping the <img> inside the <a href of login.html> allows us to
                    to click on the user icon to navigate directly to the login page.
                    src needs to be our profile picture for the user-->
                    <img src="res/images/profile.png" alt="User Profile Icon" class="profile-icon">
                </a>
            </div>
        </nav>
    </header>

    <!-- Main container layout using Flexbox (sidebars and feed) -->
    <div class="container">
        <!--Left sidebar-->
        <aside class="sidebar left-sidebar"></aside>
        
        <!--Main feed conten-->
        <main class="feed">
        
        <!-- End of main container-->
        </main>

        <!--Sidebar Right-->
        <aside class="sidebar right-sidebar"></aside>
    </div>

    <!--Footer-->
    <footer>
        <p>Footer</p>
    </footer>

</body>
</html>
